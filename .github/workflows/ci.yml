# SPDX-License-Identifier: GPL-3.0-or-later
#
# CTRM continuous integration.
#   lint:       always. Runs scripts/lint.sh (the same checks as the local hooks).
#   build-test: only when code changed and a root CMakeLists.txt exists. Debug, all tests.
#   perf:       same condition. Release, only the timing tests (CTest label perf).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with expected_cf_major in scripts/lint.sh.
  CLANG_FORMAT_VERSION: "23.1.5"
  # Keep in sync with the Homebrew version (brew install editorconfig-checker).
  EDITORCONFIG_CHECKER_VERSION: "4.0.2"
  EDITORCONFIG_CHECKER_SHA256: "44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003"
  QT_VERSION: "6.8.*"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      has-cmake: ${{ steps.cmake.outputs.present }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.editorconfig'
              - '!.gitattributes'
              - '!.gitignore'
              - '!.clangd'
              - '!.clang-format'
              - '!.clang-tidy'
              - '!.githooks/**'
              - '!scripts/setup-dev.*'
              - '!scripts/lint.sh'

      - name: Check for root CMakeLists.txt
        id: cmake
        run: |
          if [ -f CMakeLists.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No root CMakeLists.txt. Build and test are skipped."
          fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install lint tools
        run: |
          python -m pip install --disable-pip-version-check "clang-format==$CLANG_FORMAT_VERSION"
          base=https://github.com/editorconfig-checker/editorconfig-checker/releases/download
          archive=editorconfig-checker-linux-amd64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "$base/v$EDITORCONFIG_CHECKER_VERSION/$archive"
          echo "$EDITORCONFIG_CHECKER_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ec"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/ec" editorconfig-checker
          echo "$RUNNER_TEMP/ec" >> "$GITHUB_PATH"

      - name: Run scripts/lint.sh
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case $EVENT in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ]; then
                range="$PUSH_AFTER~1..$PUSH_AFTER"
              else
                range="$PUSH_BEFORE..$PUSH_AFTER"
              fi
              ;;
            *) range="" ;;
          esac
          if [ -n "$range" ]; then
            echo "Commit range: $range"
            sh scripts/lint.sh --range "$range"
          else
            sh scripts/lint.sh
          fi

  build-test:
    name: Build and test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.has-cmake == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
          - name: macOS
            os: macos-15
            qt-arch: clang_64
          - name: Windows
            os: windows-2022
            qt-arch: win64_msvc2022_64
    env:
      # Run Qt GUI tests without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --preset ci

      - name: Show the output of failed tests
        if: failure()
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --preset ci --rerun-failed --verbose

  perf:
    name: Performance tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.has-cmake == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
          - name: macOS
            os: macos-15
            qt-arch: clang_64
          - name: Windows
            os: windows-2022
            qt-arch: win64_msvc2022_64
    env:
      # Run Qt GUI tests without a display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl-dev libegl-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset perf

      - name: Build
        run: cmake --build --preset perf

      - name: Test (label perf)
        run: ctest --preset perf -L perf
